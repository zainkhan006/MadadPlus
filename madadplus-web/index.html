<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madad+ &middot; Dispatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">Madad+</span>
      <span class="topbar__divider">&middot;</span>
      <span class="topbar__org" id="orgName">City Emergency Services</span>
    </div>
    <div class="topbar__status" id="connectionStatus" data-state="connecting">
      <span class="status-dot"></span>
      <span class="topbar__status-text" id="statusText">Connecting&hellip;</span>
    </div>
  </header>

  <main class="console">

    <section class="map-pane">
      <div id="map"></div>
      <div class="map-pane__hint">Click anywhere on the map to simulate a new call</div>
      <div class="map-pane__legend">
        <span class="legend-item"><i class="legend-dot legend-dot--free"></i>Free</span>
        <span class="legend-item"><i class="legend-dot legend-dot--busy"></i>Busy</span>
        <span class="legend-item"><i class="legend-dot legend-dot--unavailable"></i>Unavailable</span>
      </div>
    </section>

    <aside class="board-pane">

      <div class="tabs" id="tabs">
        <button class="tab tab--free is-active" data-tab="FREE">
          Free <span class="tab__count" id="countFree">0</span>
        </button>
        <button class="tab tab--busy" data-tab="BUSY">
          Busy <span class="tab__count" id="countBusy">0</span>
        </button>
        <button class="tab tab--unavailable" data-tab="UNAVAILABLE">
          Unavailable <span class="tab__count" id="countUnavailable">0</span>
        </button>
      </div>

      <div class="board" id="board">
        <ul class="board-list" id="listFree"></ul>
        <ul class="board-list is-hidden" id="listBusy"></ul>
        <ul class="board-list is-hidden" id="listUnavailable"></ul>
      </div>

    </aside>

  </main>

</div>

<!-- Reassign modal -->
<div class="modal" id="reassignModal">
  <div class="modal__card">
    <h2>Reassign booking</h2>
    <p class="modal__sub" id="reassignSub"></p>
    <ul class="modal__list" id="reassignList"></ul>
    <button class="modal__close" id="reassignClose">Cancel</button>
  </div>
</div>

<!-- Leaflet JS (OpenStreetMap) — must load before app.js, which uses the L global -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Socket.IO client -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- App logic -->
<script src="app.js"></script>

</body>
</html>
